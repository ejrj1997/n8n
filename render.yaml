# Blueprint para desplegar n8n en Render (plan free) con Supabase Postgres
# como base de datos persistente.
#
# Este Blueprint usa instancias free (campo `plan`) para el servicio web.
# n8n se despliega desde la imagen Docker oficial y guarda todos sus datos
# (workflows, credenciales, ejecuciones) en Postgres hospedado en Supabase,
# porque el filesystem del plan free de Render es efímero.
#
# La contraseña de la base de datos se configura como secreto en Render
# (vía dashboard o API) DESPUÉS de la creación del servicio. NO se almacena
# en este archivo por seguridad.

services:
  - type: web
    plan: free
    # Runtime para servicios que usan una imagen Docker pre-construida
    runtime: image
    name: n8n-service
    image:
      # Imagen oficial de n8n (latest) desde Docker Hub
      url: docker.io/n8nio/n8n:latest

    # Configuración del health check (n8n expone /healthz)
    healthCheckPath: /healthz

    # Variables de entorno requeridas por n8n
    envVars:
      # Clave de cifrado generada por Render y mantenida entre despliegues.
      # NO modificarla después de la primera sincronización, o se perderán
      # las credenciales cifradas.
      - key: N8N_ENCRYPTION_KEY
        generateValue: true

      # Conexión a Postgres — apunta a Supabase
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        value: aws-1-us-east-2.pooler.supabase.com
      - key: DB_POSTGRESDB_PORT
        value: 5432
      - key: DB_POSTGRESDB_DATABASE
        value: postgres
      - key: DB_POSTGRESDB_USER
        value: n8n_user.kyemexorbnqdzmvgtclh
      - key: DB_POSTGRESDB_PASSWORD
        value: "REEMPLAZAR_VIA_API_SECRETO"
      # Supabase requiere conexiones SSL
      - key: DB_POSTGRESDB_SSL_ENABLED
        value: "true"
      - key: DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED
        value: "false"

      # Configuración general de n8n
      - key: N8N_PORT
        value: 5678
      - key: N8N_PROTOCOL
        value: https
      # Límite del heap de Node: evita "JavaScript heap out of memory" en el
      # plan free de Render (512 MB). El default de Node deja solo ~256 MB.
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: GENERIC_TIMEZONE
        value: America/Caracas
